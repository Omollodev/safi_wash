{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0"><i class="bi bi-bell" aria-hidden="true"></i> Notifications</h1>
  <form method="post" action="{% url 'notifications:mark_all_read' %}">{% csrf_token %}<button class="btn btn-outline-secondary btn-sm"><i class="bi bi-check2-all" aria-hidden="true"></i> Mark all as read</button></form>
</div>
<div class="list-group shadow-sm">
  {% for n in page %}
  <form method="post" action="{% url 'notifications:mark_read' n.pk %}" class="list-group-item list-group-item-action {% if not n.is_read %}fw-semibold bg-info-subtle{% endif %}">
    {% csrf_token %}
    <button class="btn btn-link text-start text-reset text-decoration-none p-0 w-100" type="submit">
      <div class="d-flex justify-content-between"><span><i class="bi {{ n.icon }}"></i> {{ n.title }}</span><small class="text-secondary">{{ n.created_at|timesince }} ago</small></div>
      <div class="small text-secondary fw-normal">{{ n.message }}</div>
    </button>
  </form>
  {% empty %}<div class="list-group-item text-secondary">You're all caught up.</div>{% endfor %}
</div>
{% include "partials/_pagination.html" %}
{% endblock %}
